.btn-wipe {
  position: relative;
  padding: 0 35px;
  border: none;
  cursor: pointer;
  overflow: hidden;
  border-radius: 50px;
  box-sizing: border-box;
  color: #3b3b3b;
  background: white;
  box-shadow: inset 0 0 0 1px #3b3b3b;
  transition: color 0.4s ease, box-shadow 0.8s ease;
  outline: none !important;

  letter-spacing: 0.9%;
}
.btn-wipe::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-101%);
  transition: transform 0.4s ease-out, border-radius 0.8s ease;
  z-index: 1;
  border-radius: 0;
  background: linear-gradient(90deg, #6b2481 0%, #9c44b9 100%);
}
.btn-wipe span,
.btn-wipe i {
  position: relative;
  z-index: 2;
}
.btn-wipe:hover {
  color: #fff;
  box-shadow: inset 0 0 0 1px transparent;
}
.btn-wipe:hover::after {
  transform: translateX(0);
  border-radius: 50px;
}
.btn-wipe--outline {
  background: transparent;
  color: #fff;
  box-shadow: 0 0 0 1px #fff;
